@keyframes fcard{0%{opacity:0;background:rgba(6,6,8,0)}20%{opacity:1;background:rgba(6,6,8,.92)}70%{opacity:1;background:rgba(6,6,8,.92)}100%{opacity:0;background:rgba(6,6,8,0)}}
body.lowhp #stage{animation:lowhp 1s ease-in-out infinite}
@keyframes lowhp{0%,100%{box-shadow:inset 0 0 0 0 rgba(160,20,20,0),0 0 0 0 rgba(160,20,20,0)}30%{box-shadow:inset 0 0 40px 6px rgba(160,20,20,.35),0 0 18px 2px rgba(160,20,20,.25)}}
.rite{text-align:center}.rite p{text-align:left}
.rbig{font-size:64px;line-height:1;margin:6px 0 2px;animation:rin 1.6s cubic-bezier(.2,.8,.2,1) both,rglow 3s ease-in-out 1.6s infinite alternate}
.rname{font-size:22px;letter-spacing:.3em;text-transform:uppercase;margin-bottom:14px;animation:rfade 1.2s .6s both}
@keyframes rin{0%{transform:scale(2.6);opacity:0;filter:blur(6px)}100%{transform:scale(1);opacity:1;filter:blur(0)}}
@keyframes rglow{from{text-shadow:0 0 8px currentColor}to{text-shadow:0 0 26px currentColor,0 0 4px #fff}}
@keyframes rfade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.oath{text-align:center !important;font-style:italic;font-size:18px;margin:16px 0}
.runl{border:1px solid #3a3a44;border-radius:8px;padding:10px 12px;margin:12px 0;text-align:left}
.rrow{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid #26262c}.rrow .rs{font-size:26px;width:30px;text-align:center}.rrow.locked{opacity:.55}
.rbadge{letter-spacing:.02em}
.contract{margin-top:8px;opacity:.9}
.art.img .eg{position:absolute;inset:0;mix-blend-mode:screen;pointer-events:none}
.art.img .edge{position:absolute;inset:0;box-shadow:inset 0 0 36px 10px #16161b;pointer-events:none}
.art.img.hitfx{animation:hitimg .32s}
.art.img.hitfx .base{filter:brightness(1.8)}
@keyframes hitimg{0%{transform:translateX(0)}25%{transform:translateX(-7px)}50%{transform:translateX(6px)}75%{transform:translateX(-3px)}100%{transform:translateX(0)}}
.legend{font-size:.78rem;color:var(--dim);margin-top:6px}
.foot{text-align:center;font-size:.72rem;color:#3d3b38;margin-top:30px}
</style>

const QSTORY={
bq0:['Brenn winkt dich in sein Zelt. Das hat er noch nie gemacht. Auf dem Tisch liegt sein dickes Buch, aufgeschlagen.\n„Setz dich. Und fass nichts an.“','„Da drin steht jeder, der runtergegangen ist. Seit der ersten Expedition. Wer zurückkommt, kriegt einen Haken. Wer nicht, einen Strich.“\nEr blättert. Neben vielen Namen stehen ganze Reihen davon.','„Die Striche mach ich nicht.“ Er sieht dich dabei nicht an. „Die sind morgens einfach da, seit dreißig Jahren schon. Jeden Tag ein paar mehr.“','„Die Alten erzählen, in der Krypta gibt es eine Wand voller Striche. Ich hab das immer für Geschwätz gehalten. Wenn du da unten bist, schau sie dir an. Schreib ab, was da steht. Und sag Varga nichts.“\n+Neuer Auftrag: Brenns Buch'],
bq1:['Brenn legt deine Abschrift neben sein Buch. Er fährt mit dem Finger die Namen entlang, Zeile für Zeile. Dann sitzt er lange still da.','„Gleich. Jeder Name, jeder Strich. Bis auf den letzten.“ Er tippt auf deinen Namen. „Den hab ich noch nicht.“','„Ich muss dir was sagen. Die erste Expedition war nicht zu siebt, ich gehörte auch dazu. Am Morgen stand ich am Seil und bin nicht runter. Die Beine haben einfach nicht mitgemacht.“','„In der Nacht danach hab ich am Stein eine Stimme gehört, ganz ruhig. Sie hat gesagt: Einer muss ja zählen. Seitdem zähl ich, und der da unten zählt mit.“','„Varga nennt ihn den Zählenden. Wenn du ihm je begegnest, mach dem ein Ende. Dann hab ich vielleicht endlich Ruhe.“\n+20 Seelensplitter · Neuer Auftrag: Der Zählende'],
bq2:['Als du ins Lager kommst, steht Brenn schon vor seinem Zelt. Er hat das Buch dabei.\n„Heute Morgen waren keine neuen Striche da. Zum ersten Mal seit dreißig Jahren.“','Er schlägt die letzte Seite auf. Dein Name steht noch da, aber der Platz daneben ist leer. Die alten Striche sind blass geworden, als hätte jemand mit dem Daumen drübergewischt.','„Ich zähl trotzdem weiter. Aber nur noch die, die zurückkommen.“ Er klappt das Buch zu. „Und wer mir den Schlaf zurückgibt, zahlt bei mir weniger.“\n+80 Seelensplitter · Brenns Vorräte kosten dich ab jetzt 20 % weniger'],
narbe:['Varga sieht dir auf die Hand, als du am Stein aufwachst. Die Narbe ist größer geworden. Dunkle Adern ziehen sich bis zum Handgelenk.\n„Komm mit. Zeit, dass du die ganze Geschichte hörst.“','„Wir waren sieben. Keiner von uns wusste, was wir da unten eigentlich suchen. Auf der zwölften Etage ist der Gang über mir eingestürzt. Mein Arm war Brei. Ich hab mich in eine Halle geschleppt und mich an einen schwarzen Stein gelehnt. Da bin ich verblutet.“','„Am nächsten Morgen bin ich aufgewacht. Neben dem Stein. Die Wunde war zu, der Arm weg. Und auf meiner Handfläche war das hier.“\nSie hält dir ihre Hand hin. Die Narbe darauf ist so schwarz, dass sie fast glänzt.','„Die anderen haben nicht lange überlegt. Wir hatten kein Essen mehr und keinen sicheren Weg nach oben. Also haben sich alle sechs die Hand aufgeschnitten und auf den Stein gedrückt. Lieber an einen Stein gebunden als tot.“','„Wer danach starb, wachte wieder beim Stein auf, und der lag ja unten. Also mussten wir ihn mitnehmen. Drei Wochen haben wir an dem Ding gezogen. Oben angekommen bin nur ich. Die anderen hat es wieder runtergezogen. Du merkst das auch, oder?“','„Die Narbe wächst mit jedem Tod. Irgendwann nimmt sie dir was und gibt dir was anderes dafür. Mir hat sie den Schlaf genommen.“\nSie lacht kurz. „Wähl gut.“'],
vq0:['Varga setzt sich zu dir ans Feuer. Das macht sie sonst nie.\n„Ich muss dich um was bitten.“','„Bei der ersten Expedition waren wir zu siebt. Ich bin zurückgekommen. Kaelen nicht. Er war die Nummer sieben.“','„Er ist irgendwo in der Krypta verschwunden. Wenn du da unten sein Abzeichen findest … bring es mir. Bitte.“\n+Neuer Auftrag: Vargas Bitte'],
vq1:['Du legst Varga das Abzeichen in die Hand. Sie dreht es lange hin und her.\n„Das ist seins.“','„Aber da ist kein Blut dran. Keine Kratzer. Als hätte er es einfach … abgelegt.“\nSie schluckt. „Er hat immer Tagebuch geschrieben. Wenn er weitergegangen ist, dann Richtung Glutschlund.“\n+30 Seelensplitter · Neuer Auftrag: Das Tagebuch'],
vq2:['Varga liest im Tagebuch. Sehr lange. Irgendwann klappt sie es zu.','„Er schreibt, dass der Stein ihn nach unten ruft und dass er nicht mehr zurückwill.“\nSie sieht dich an. „Wenn er noch da unten ist, dann ist er nicht mehr der Kaelen von damals. Dann musst du es beenden.“\n+50 Seelensplitter · Kaelen steht jetzt auf der Kopfgeldliste'],
kaelen:['Du erzählst Varga von Kaelen, von seiner Klinge und wie er dich am Ende angesehen hat.','Sie sagt lange nichts. Dann steht sie auf, geht zum Stein und legt das Abzeichen daneben.\n„Danke“, sagt sie. „Jetzt kann ich ihn von meiner Liste streichen.“','„Hier. Das hat er mir mal geschenkt, für Notfälle. Ich glaub, du brauchst es mehr als ich.“\n+Vargas Talisman: dauerhaft +10 % max. LP · +100 Seelensplitter']};

function weekKey(){const d=new Date(),o=new Date(d.getFullYear(),0,1),w=Math.ceil(((d-o)/864e5+o.getDay()+1)/7);return d.getFullYear()+'-'+w}

function compDown(n){try{smp('ghost',.45,.8);tone(55,.9,'sine',.3,0,.6)}catch(e){}if(typeof document==='undefined')return;setTimeout(()=>{let d=document.getElementById('say');if(d)d.remove();d=document.createElement('div');d.id='say';d.classList.add('dead');d.innerHTML=`<div class="q">${n} ist gefallen.</div><div class="w">Dein Begleiter</div>`;document.body.appendChild(d);requestAnimationFrame(()=>d.classList.add('on'));setTimeout(()=>{d.classList.remove('on');setTimeout(()=>d.remove(),900)},3000)},350)}
function sayQ(t,w,dl=0){if(typeof document==='undefined')return;setTimeout(()=>{let d=document.getElementById('say');if(d)d.remove();d=document.createElement('div');d.id='say';d.innerHTML=`<div class="q">„${t}“</div>${w?`<div class="w">— ${w}</div>`:''}`;document.body.appendChild(d);requestAnimationFrame(()=>d.classList.add('on'));setTimeout(()=>{d.classList.remove('on');setTimeout(()=>d.remove(),900)},CFG.anim?3200:2400)},dl)}

const LORE={
wurmnest:{t:'Das Wurmnest',x:'Vurm war nicht allein. Tief unter den Höhlen, wo seine Gänge zusammenlaufen, liegt ein Nest aus ledrigen Eiern und eine Mutter, die größer ist als er. Was sie frisst, verdaut sie nicht ganz. Manches davon kommt verändert wieder heraus und bleibt an dem hängen, der es trägt, wie die Splitter an der Seele.'},
koenigsgeist:{t:'Der Geist des Knochenkönigs',x:'Vor dem Stein gab es hier unten ein Königreich. Es lag nicht in der Tiefe, die Tiefe kam zu ihm. Der König hat seine Leute in die Krypta geführt, als der Riss sich auftat, und versprochen, sie wieder hinauszuführen. Er sitzt noch immer auf seinem Thron und wartet darauf, dass jemand sagt, dass es vorbei ist.'},
riss:{t:'Der Riss',x:'Unter Aschwald liegt ein Spalt, der tiefer geht, als jedes Seil reicht. Jede Nacht verschieben sich seine Gänge. Die Karten von gestern taugen heute nichts mehr. Trotzdem steigen jeden Morgen Leute hinab, weil unten Erz, Relikte und Dinge liegen, für die Händler aus dem ganzen Land bezahlen.'},
stein:{t:'Der Ankerstein',x:'Ein schwarzer Stein, so groß wie ein Ochsenkarren, halb im Boden versunken. Die erste Expedition hat ihn auf der zwölften Etage gefunden und in drei Wochen nach oben geschleppt. Wer sein Blut darauf gibt, ist an ihn gebunden: Stirbt er im Riss, wacht er neben dem Stein wieder auf, so wie er war, als er den Stein zum ersten Mal berührt hat. Nur was er dabeihatte, bleibt unten.'},
expedition:{t:'Die erste Expedition',x:'Vor dreißig Jahren stiegen sieben Leute aus Aschwald in den Riss, um zu sehen, wie tief er geht. Auf der zwölften Etage stürzte ein Gang ein und zerquetschte Vargas Arm. Sie schleppte sich in eine Halle, lehnte sich an einen schwarzen Stein und verblutete dort. Am nächsten Morgen wachte sie neben ihm auf, lebendig. Die anderen sechs schnitten sich daraufhin die Hände auf und drückten sie auf den Stein. Lieber an einen Stein gebunden als tot.'},
narbe:{t:'Das Ankermal',x:'Wo der Stein dein Blut getrunken hat, schließt sich die Haut nie ganz. Es bleibt eine Narbe, dunkel wie der Stein selbst, mit feinen Adern, die bei Kälte ziehen. Jedes Mal, wenn er dich zurückholt, wächst sie ein Stück. Varga sagt, so merkt sich der Stein, wem du gehörst. Und irgendwann nimmt er sich etwas von dir und gibt dir etwas anderes dafür.'},
orden:{t:'Der Orden',x:'Die Ankerträger nennen sich selbst den Orden, auch wenn es eher ein Haufen von Leuten ist, die nichts mehr zu verlieren hatten. Sie teilen sich Zelte, Feuer und Gerüchte. Ihr Erkennungszeichen ist die Narbe auf der Handfläche, wo das Blut den Stein berührt hat.'},
varga:{t:'Varga',x:'Varga war bei der ersten Expedition dabei. Sie war die Erste, deren Blut der Stein getrunken hat. Weil ihr Arm da schon fehlte, hat er ihn ihr nie zurückgegeben. Von den sieben kam nur sie mit dem Stein oben an. Heute bringt sie Neulingen bei, wie man unten überlebt, und führt eine Liste mit Namen von Leuten, die der Stein irgendwann nicht mehr zurückgeholt hat.'},
hild:{t:'Hild, die Schmiedin',x:'Hild war nie unten. Sie sagt, sie mag kein Feuer, das sie nicht selbst angezündet hat. Aber alles, was die Ankerträger heraufbringen, landet früher oder später auf ihrem Amboss. Rosteisen, Grabsilber, Glutstein. Und manchmal Dinge, über die sie lieber nicht spricht.'},
splitter:{t:'Seelensplitter',x:'Wenn unten etwas stirbt, bleibt ein bisschen Licht übrig. Es hängt sich an die Seele, nicht an den Körper. Deshalb kommt es mit zurück, wenn der Stein dich holt. Varga weiß, wie man damit Leute stärker macht. Woher das Licht eigentlich kommt, fragt man sie besser nicht.'},
haendler:{t:'Die Händler',x:'Unten gibt es Händler, und keiner im Orden weiß so genau, warum. Varga sagt, es sind Ankerträger, die irgendwann beschlossen haben, nicht mehr hochzukommen. Sie kaufen den Toten ihre Sachen ab und verkaufen sie an die Lebenden. Wenn der Riss sich nachts verschiebt, stehen ihre Karren trotzdem immer an irgendeinem Gang, als würde er sie in Ruhe lassen. Gold nehmen sie, weil der Orden ihnen dafür Essen und Lampenöl am Seil runterlässt.'},
seile:{t:'Die Seile',x:'Der Orden hat bis zur zwanzigsten Etage Schächte gesichert und Seile gespannt. Weiter unten war noch keiner lange genug am Leben, um eins anzubringen. Wer tiefer geht, kommt nur auf einem Weg zurück: über den Stein.'},
brenn2:{t:'Der Achte',x:'Die erste Expedition war zu acht. Einer blieb oben am Seil stehen. Seitdem führt er Buch über alle, die hinabsteigen, und etwas tief unten führt das gleiche Buch.'},
brenn:{t:'Brenn, der Quartiermeister',x:'Brenn verwaltet die Ordenskasse. Jedes Goldstück, das jemand lebend nach oben bringt, geht durch seine Finger. Er packt dafür Vorräte für den nächsten Abstieg. Er selbst war nie unten. „Einer muss ja zählen“, sagt er.'},
kaelen:{t:'Kaelen, die Nummer sieben',x:'Kaelen war der Siebte der ersten Expedition. Er hat als Erster gemerkt, dass der Stein die Leute nach unten zieht. In seinem Tagebuch steht, dass er keine Angst hatte, nur Heimweh. Wonach, wusste er selbst nicht mehr.'},
foerder:{t:'Der Förderkorb',x:'Auf Etage 30 hängt ein Förderkorb an Ketten, die in der Dunkelheit nach oben verschwinden. Der Korb ist älter als der Orden und älter als Aschwald. Niemand weiß, wer ihn gebaut hat. Aber die Ketten halten noch.'},
a0:{t:'Feuchte Höhlen',x:'Hier oben trainieren die Neuen. Die Goblins bauen ihre Nester aus der Ausrüstung von Ankerträgern. Manche Teile davon sind älter als der Orden selbst.'},
b1:{t:'Krags Hand',x:'Auf Krags Handfläche war eine Narbe. Genau dieselbe, die du seit deinem ersten Tag am Stein trägst.'},
a1:{t:'Vergessene Krypta',x:'Irgendwer hat diese Gräber angelegt, lange bevor es Aschwald gab. Die Inschriften kann niemand lesen. In manchen Särgen liegen Leute mit einer Narbe auf der Hand.'},
b2:{t:'Letzte Worte',x:'Der Knochenkönig hat im Zerfallen noch etwas geflüstert: „Irgendwann ruft der Stein nicht mehr.“'},
a2:{t:'Glutschlund',x:'Die Aschenkultisten hier unten waren mal Ankerträger. Sie beten zu etwas, das noch tiefer liegt, und am Ende jedes Gebets sagen sie ein Wort, das keiner nachsprechen kann.'},
b3:{t:'Ein bekannter Name',x:'In Ignaroths Asche lag ein Ordensabzeichen. Der Name darauf steht auf Vargas Liste der Vermissten.'},
a3:{t:'Frostgruft',x:'Im Eis stecken Ankerträger. Sie sehen nicht aus, als wären sie erfroren. Eher, als hätten sie auf etwas gewartet.'},
b4:{t:'Eine Warnung',x:'„Jedes Mal, wenn du zurückkommst, bleibt ein Stück von dir hier unten“, hat Hrimfang gesagt. „Irgendwann ist mehr von dir hier als oben.“'},
a4:{t:'Der Abgrund',x:'Hier unten zieht die Narbe an deiner Hand, und zwar nach unten.'},
ende:{t:'Das Namenlose',x:'Der Ankerstein ist ein Stück vom Namenlosen. Wer an ihn gebunden ist, gehört am Ende ihm, und die Wächter da unten sind Ankerträger, von denen irgendwann mehr unten als oben war. Du hast das Namenlose zerschlagen. Ob dich der Stein trotzdem noch hält, wird sich zeigen.'},
};

{id:'mutter',area:0,name:'Mutter Schleim',t:'Die, die nicht kleiner wird',reward:25,hp:3,atk:.9,traits:{regen:.035},story:'Ein Schleimberg, der die halbe Höhle ausfüllt. Wunden schließen sich bei ihr fast sofort. Wer sie erledigen will, muss schneller zuschlagen, als sie heilt.',after:'In ihrem Inneren schwamm ein Schwert, das noch glänzte wie neu.'},
{id:'aldric',area:1,name:'Ser Aldric',t:'Der Wächter, den keiner abgelöst hat',reward:40,hp:2.4,atk:1.1,def:5,traits:{enrage:1},story:'Ein Skelett in voller Rüstung, das immer noch seine Runden dreht. Seine Rüstung schluckt fast jeden Schlag. Und wenn er erst mal blutet, wird er richtig wütend.',after:'Auf seinem Schild stand ein Datum. Fünfzig Jahre bevor es Aschwald gab.'},
{id:'weinende',area:1,name:'Die Weinende',t:'Banshee der Krypta',reward:40,hp:2,atk:1.1,traits:{evade:.3,poison:true},story:'Man hört sie lange, bevor man sie sieht. Sie ist kaum zu treffen, und wenn sie dich berührt, wird dein Blut schwarz.',after:'Als sie verstummt ist, war es in der Krypta zum ersten Mal richtig still.'},
{id:'ossa',area:2,name:'Brandmeisterin Ossa',t:'Hohepriesterin der Asche',reward:60,hp:2.3,atk:1.1,traits:{ls:.4,double:1},story:'Sie war mal Ankerträgerin, sagt Varga. Jetzt predigt sie da unten von dem, was am Grund wartet. Jeder Treffer, den sie landet, macht sie wieder heil.',after:'Ihr letzter Satz: „Er zählt jeden von euch.“'},
{id:'schlacke',area:2,name:'Schlackenherz',t:'Der Golem, der nicht fällt',reward:60,hp:3.2,atk:1.2,def:4,traits:{regen:.03},story:'Ein Golem aus glühendem Gestein. Er heilt sich aus der Lava unter seinen Füßen und schlägt zu wie ein Steinschlag.',after:'Als das Glühen ausging, blieb ein Herz aus schwarzem Glas übrig. Es war noch warm.'},
{id:'weissfell',area:3,name:'Weißfell',t:'Leitwolf der Frostgruft',reward:80,hp:2.2,atk:1.05,traits:{evade:.3,double:1},story:'Schneller als alles andere da unten. Er weicht aus, beißt zweimal zu und ist weg, bevor du die Waffe hebst.',after:'Das Rudel hat sich zurückgezogen. Es wird sich einen neuen Leitwolf suchen.'},
{id:'ylva',area:3,name:'Ylva',t:'Die Eishexe',reward:80,hp:2.5,atk:1.2,traits:{enrage:1,ls:.25},story:'Sie friert ihre Opfer lebendig ein und stellt sie auf wie eine Sammlung. Je mehr sie blutet, desto gefährlicher wird sie.',after:'In ihrer Sammlung war noch ein Platz frei. Darunter stand dein Name im Eis.'},
{id:'zaehlende',area:4,name:'Der Zählende',t:'Niemand weiß, was er ist',reward:120,hp:2.6,atk:1.25,traits:{evade:.25,regen:.025},story:'Keiner, der ihn gesehen hat, kann ihn beschreiben. Alle erzählen nur, dass er beim Kämpfen leise zählt. Er heilt sich und weicht aus, und er hat Geduld.',after:'Kurz bevor er fiel, hat er eine Zahl geflüstert. Genau so oft bist du schon am Stein aufgewacht.'},

const INTRO=[
'Unter der Stadt Aschwald liegt der Riss. Keiner weiß, wie tief er geht. Jede Nacht verschieben sich seine Gänge, als würde da unten jemand umräumen.',

'Brenn zählt vor seinem Zelt Münzen. Am Seil warten zwei Neue darauf, dass sie runterdürfen.',

const VARGA=['„Iss was, bevor du runtergehst. Mit leerem Magen stirbt man schneller.“','„Der Riss hat sich heute Nacht wieder bewegt. Die Karten von gestern kannst du vergessen.“','„Splitter sind kein Spielgeld. Gib sie für was Vernünftiges aus.“','„Wenn einer ausholt, gehst du in Deckung. Wie oft soll ich das noch sagen?“','„Die anderen nennen dich schon Stammgast am Stein.“','„Mein Arm? Ist unten geblieben. Lange Geschichte.“','„Du siehst müde aus. Geh trotzdem.“','„Wenn du unten einen Händler triffst, frag nicht, wie er da hingekommen ist.“','„Wie lang warst du diesmal unten? Egal. Du bist oben.“','„Drei Seillängen unter der Krypta wird es heiß. Merk dir das.“','„Haken, kein Strich. Und jetzt los.“'];

const SAGA={
i7:{t:'Vargas Name',l:['Varga sitzt am Stein, als du zurückkommst. Sie hat geweint, und sie versucht nicht, es zu verstecken.','„Isgard“, sagt sie. „So hieß ich, bevor ich hier oben geblieben bin. Ich war die Dreizehnte. Die, die nicht mitgegangen ist.“','Sie legt dir die Hand auf die Schulter. Seitdem fühlt sich jeder Abstieg ein bisschen leichter an.','(Dauerhaft +5 % max. LP)']},
i8:{t:'Der Grund',l:['Der Stein hat aufgehört zu flüstern.','Niemand weiß, ob er tot ist oder nur schläft. Varga sagt, das sei auch egal. Wichtig sei, dass er jetzt weiß, dass jemand bis zu ihm kommt.','Am Abend schnitzt Brenn einen neuen Namen in den Pfosten neben dem Feuer. Ganz oben, über allen anderen.','Es ist deiner.']},
i5:{t:'Das Schmelzwasser',l:['Seit Hrimfang gefallen ist, tropft es in der Frostgruft.','Das Eis gibt frei, was es hundert Jahre gehalten hat: Ankerträger, die Augen noch offen. Varga kennt manche Namen.','„Sie haben nicht gefroren, weil es kalt war“, sagt sie. „Sie haben gefroren, weil er sie behalten wollte.“','An den Feuern dort unten wärmt das Wasser jetzt doppelt. Als wollte die Gruft sich entschuldigen.']},
i6:{t:'Das Flüstern',l:['Als das Namenlose fällt, wird es oben am Stein sehr still.','Dann fängt er an zu flüstern. Nicht laut. Nur, wenn du die Hand auf ihn legst.','Er sagt nicht, was er will. Er zählt Namen auf. Deinen auch.','Varga sagt, der Riss ist nicht zu. Er hat nur gemerkt, dass jemand bis zum Grund kommt. Und jetzt will er sehen, ob du es noch einmal schaffst, wenn er sich wehrt.']},
k1:{t:'Kapitel I · Der Handel',l:['Jeden Morgen steigen sie hinab. Jeden Abend wachen ein paar von ihnen neben dem Stein wieder auf.','Das ist der Handel: Du gibst dein Blut, und der Stein holt dich zurück. Was er sonst noch will, hat nie jemand gefragt.','Varga sagt, er nimmt nur, was unten liegen bleibt. Gold, Waffen, ein bisschen Haut.','Seit ein paar Nächten zieht die Narbe auf deiner Hand. Nicht stark. Aber immer in dieselbe Richtung.']},
i1:{t:'Krag',l:['Als Krag fällt, öffnet sich seine Faust.','Auf der Handfläche ist eine Narbe, dunkel wie der Stein. Dieselbe, die du trägst.','Sie ist alt. Viel älter als deine.']},
k2:{t:'Kapitel II · Die Liste',l:['Du hast Varga von Krags Hand erzählt. Sie hat nichts dazu gesagt.','Abends sitzt sie lange über ihrer Liste. Namen von Leuten, die der Stein irgendwann nicht mehr zurückgeholt hat.','Am Feuer heißt es, die Goblins bauen ihre Nester aus Ordensrüstungen. Keiner fragt, woher die Rüstungen kommen.','Zum ersten Mal fragst du dich, wie viele von denen da unten mal oben am Feuer saßen.']},
i2:{t:'Der Knochenkönig',l:['Der Knochenkönig zerfällt. Bevor nur noch Staub übrig ist, flüstert er etwas.','„Irgendwann ruft der Stein nicht mehr.“']},
k3:{t:'Kapitel III · Zu lange',l:['„Er war einer von uns“, sagt Varga über den Knochenkönig. „Er ist zu lange unten geblieben.“','Zu lange. Sie sagt es, als ginge es um Zeit und nicht um Pech.','Deine Narbe ist gewachsen. Die feinen Adern reichen jetzt bis zum Handgelenk.','Und der Stein im Lager kommt dir größer vor als an dem Tag, an dem du ihn zum ersten Mal berührt hast.']},
i3:{t:'Ignaroth',l:['In Ignaroths Asche liegt ein Ordensabzeichen.','Der Name darauf steht auf Vargas Liste der Vermissten.']},
k4:{t:'Kapitel IV · Heimweh',l:['Auf Etage 30 hängt ein Förderkorb an Ketten. Er ist älter als der Orden und älter als Aschwald.','Jemand war schon einmal hier unten, lange vor euch. In der Krypta liegen sie in ihren Särgen, mit Narben auf den Händen.','Die Kultisten im Glutschlund waren Ankerträger. Sie beten zu etwas, das noch tiefer liegt.','Sie beten nicht wie Leute, die Angst haben. Sie beten wie Leute, die nach Hause wollen.']},
i4:{t:'Hrimfang',l:['„Jedes Mal, wenn du zurückkommst, bleibt ein Stück von dir hier unten“, sagt Hrimfang.','„Irgendwann ist mehr von dir hier als oben.“']},
k5:{t:'Kapitel V · Der Haken',l:['Die im Eis sahen nicht erfroren aus. Sie sahen aus, als hätten sie gewartet.','Jetzt verstehst du, was der Stein ist. Kein Anker. Ein Haken. Und am anderen Ende der Schnur zieht etwas.','Ganz unten liegt das, wovon der Stein abgebrochen ist. Varga spricht den Namen nicht aus. Keiner tut das.','Fünf Etagen noch. Dann wirst du es sehen.']}};

function tutHint(){if(!P||!P.tut)return'';let h='';const f=P.floor;
if(S.screen==='doors')h=f===0?'Unten weißt du nie, was hinter der nächsten Ecke wartet. Ein Biest, eine Truhe, ein Händler. Geh einfach los.':f===1?'Der Goblin hatte einen Schlüssel dabei, gut. Heb den auf. Irgendwann stehst du vor einer versiegelten Tür, und dahinter liegt meistens das beste Zeug.':P.kindling>0?'Du hast Zunder dabei. Zünd dir hier vor dem Wächter ein <b>Lagerfeuer</b> an, dafür musst du nirgendwo hingehen. Zunder ist selten, also nicht verschwenden.':'Der Letzte hier unten ist ein ganzes Stück größer. Wenn er ausholt, gehst du in Deckung.';
else if(S.screen==='combat'){const e=E,warn=e.heavyEvery&&(e.turn+1)%e.heavyEvery===0&&!e.stun;
h=warn?'Pass auf, er holt aus! Geh in <b>Deckung</b>, sonst tut das gleich richtig weh.':e.turn===0&&P.cd===0?(f===1?'Keine Sorge, der ist alt und halb blind. <b>Hau einfach drauf.</b>':'Fang ruhig mit dem <b>Schildschlag</b> an. Dann ist er erst mal benommen.'):P.cd===0?'Dein <b>Schildschlag</b> ist wieder bereit. Damit haust du ihn kurz aus den Latschen, und er kann einmal nicht zurückschlagen.':P.hp<maxHp()*.45?'Du blutest ganz schön. Trink deinen <b>Heiltrank</b>, dafür hast du ihn.':'Der Schildschlag braucht jetzt ein bisschen. Schlag normal weiter und behalt ihn im Auge.'}
else if(S.screen==='room')h=S.roomKey==='tresorTuer'?'Na bitte, da ist so eine Tür. Schließ auf.':S.roomKey==='tresorDone'?'Siehst du? Deshalb schleppen alle ihre Schlüssel mit. Die kriegst du meistens von Wächtern oder von den richtig fiesen Biestern.':S.roomKey==='rast'?'Setz dich ruhig hin. Oder üb noch ein bisschen, aber übertreib’s nicht, unten wartet noch einer.':'Hab dir da was hingelegt. Nimm’s mit.';
else if(S.screen==='loot')h='Schau’s dir an. Wenn’s besser ist als dein Zeug, zieh’s an. Das alte Teil kommt in den Rucksack, das kannst du später beim Händler loswerden.';
else if(S.screen==='perks')h='Merkst du das? Du wirst stärker. Such dir was aus. Aber denk dran: Das hält nur, bis du wieder oben bist.';

const NET={db:null,user:null,uid:null,names:{},msgs:[],shades:[],ready:false,st:null};
const esc=t=>String(t==null?'':t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const WALL=['Vorsicht, hier lauert ein Elite.','Hier hilft nur Abwehren.','Spart euch die Tränke für den Wächter.','Haltet einen Schlüssel bereit.','Hier bin ich gestorben. Seid schlauer als ich.','Nicht aus der Quelle trinken!','Der Händler hier unten ist ehrlich.','Kehrt um, solange ihr könnt.','Weiter! Es lohnt sich.','Grüßt Varga von mir.','Haken, kein Strich.','Drei Seillängen noch. Haken.','Wer das liest: Haken.'];
async function netInit(){try{if(typeof claude==='undefined'||!claude.use)return;const [db,user]=await Promise.all([claude.use('db'),claude.use('user')]);NET.db=db;NET.user=user;if(user){try{NET.uid=await user.id()}catch(e){}}if(!db)return;NET.ready=true;await cloudLoad();await netRefresh();if(['hub','guild'].includes(S.screen))render()}catch(e){}}
async function netRefresh(){if(!NET.db)return;try{const [m,sh]=await Promise.all([NET.db.collection('msgs').orderBy('ts','desc').limit(300).get(),NET.db.collection('shades').orderBy('ts','desc').limit(200).get()]);NET.msgs=m.docs.map(d=>Object.assign({},d.data(),{id:d.id}));NET.shades=sh.docs.map(d=>Object.assign({},d.data(),{id:d.id}));await resolveNames([...NET.msgs,...NET.shades].map(x=>x.uid))}catch(e){}}
async function resolveNames(ids){if(!NET.user||!NET.user.profiles)return;const u=[...new Set(ids.filter(x=>typeof x==='string'&&x&&!(x in NET.names)))];if(!u.length)return;try{const ps=await NET.user.profiles(u);for(const id of u)NET.names[id]=(ps&&ps[id]&&ps[id].name)||''}catch(e){}}
const whoOf=uid=>uid&&uid===NET.uid?'dir':(NET.names[uid]||'einem anderen Ankerträger');
function cloudSave(){if(!NET.db||!NET.uid)return;clearTimeout(NET.st);NET.st=setTimeout(()=>{try{NET.db.doc('data/users/'+NET.uid+'/save').set({m:JSON.stringify(meta),ts:meta._ts||0}).catch(()=>{})}catch(e){}},2500)}
async function cloudLoad(){if(!NET.db||!NET.uid)return;try{const d=await NET.db.doc('data/users/'+NET.uid+'/save').get();if(d.exists){const x=d.data();if(x&&x.ts>(meta._ts||0)&&!P&&typeof x.m==='string'){meta=Object.assign(defMeta(),JSON.parse(x.m));try{localStorage.setItem(SAVE,JSON.stringify(meta))}catch(e){}sys('Spielstand von einem anderen Gerät geladen.');render();return}}cloudSave()}catch(e){}}
function wallMsg(f){if(!NET.msgs.length||R()>.5)return;const c=NET.msgs.filter(m=>m.floor===f&&WALL[m.t]);if(!c.length)return;const m=pick(c);log(`Kreideschrift an der Wand: „${WALL[m.t]}“ – von ${esc(whoOf(m.uid))}`,'sys')}
function leaveMsg(t){if(!NET.db)return;P.msgLeft=(P.msgLeft==null?2:P.msgLeft)-1;const doc={uid:NET.uid||'',floor:P.floor,t,ts:Date.now()};NET.db.collection('msgs').add(doc).then(()=>{NET.msgs.unshift(doc)}).catch(()=>{log('Die Kreide bricht ab – die Botschaft ließ sich nicht speichern.','dim');render()});log(`Du kritzelst an die Wand: „${WALL[t]}“`,'sys')}
function safeItem(x,nm){if(!x||!SK[x.slot])return null;const TT=x.slot==='w'?WT:x.slot==='a'?AT:XT[x.slot];if(!TT||!TT[x.type])return null;const it={slot:x.slot,type:x.type,r:Math.max(0,Math.min(3,x.r|0))};for(const k of ['atk','def','hp','crit','dodge','ls','luck','gold','skill','bleed','stun'])if(typeof x[k]==='number')it[k]=Math.max(0,Math.min(999,Math.round(x[k])));if(UNIQ[x.uq])it.uq=x.uq;if(CURSES[x.curse])it.curse=x.curse;it.name=(it.uq?UNIQ[it.uq].n:TT[x.type].n)+' aus dem Nachlass'+(it.curse?' (verflucht)':'');return it}
function pickShade(f){if(!NET.shades.length||f%5===0||R()>(meta.bounty.includes('zaehlende')?.09:.18))return null;P.shadeSeen=P.shadeSeen||[];const c=NET.shades.filter(x=>!x.claimed&&typeof x.floor==='number'&&Math.abs(x.floor-f)<=1&&!P.shadeSeen.includes(x.id));if(!c.length)return null;const x=pick(c);P.shadeSeen.push(x.id);
 return{id:x.id,nm:x.uid===NET.uid?'dir selbst':(NET.names[x.uid]||'einem Ankerträger'),cls:CLS[x.cls]?CLS[x.cls].name:'Ankerträger',floor:x.floor,item:safeItem(x.item)}}
function claimShade(id){const x=NET.shades.find(s=>s.id===id);if(x)x.claimed=true;if(!NET.db)return;try{NET.db.doc('shades/'+id).update({claimed:true,by:NET.uid||''}).catch(()=>{})}catch(e){}}
function writeShade(){if(!NET.db||P.tut)return;const it=P.weapon||P.armor;try{NET.db.collection('shades').add({uid:NET.uid||'',floor:P.floor,cls:P.cls,lvl:P.lvl,item:it?JSON.parse(JSON.stringify(it)):null,claimed:false,ts:Date.now()}).catch(()=>{})}catch(e){}}
function writeBoard(f){if(!NET.db||!NET.uid||P.tut)return;try{NET.db.doc('board/'+NET.uid).set({uid:NET.uid,best:Math.max(meta.best,f),runs:meta.runs+1,bounties:meta.bounty.length,day:meta.dayBest||null,ts:Date.now()}).catch(()=>{})}catch(e){}}
async function loadGuild(){S.guild=null;if(!NET.db){S.guild=[];return}try{const q=await NET.db.collection('board').orderBy('best','desc').limit(25).get();const rows=q.docs.map(d=>d.data()).filter(x=>x&&typeof x.best==='number');await resolveNames(rows.map(r=>r.uid));S.guild=rows}catch(e){S.guild=[]}if(S.screen==='guild')render()}
function forgeDo(t,r0){let r=r0;try{for(let i=0;i<3;i++)smp('hammer',.5*(i===2?1.15:1),.92+R()*.12,i*.55);smp('ring',.25,1,1.15)}catch(e){}const c=90*(t+1)*(r===3?4:r===2?2:1);meta.mats['m'+t]-=r===3?8:4;if(r>=2)meta.mats.kern-=r===3?2:1;meta.gold-=c;let miss=false;if(r===2&&R()>=FCH()[0]){r=1;miss=true}else if(r===3&&R()>=FCH()[1]){r=2;miss=true}const it=forgeItem(S.fSlot,S.fType,t,r);it.tier=t;meta.armory.push(it);saveMeta();sys(miss?`Der Kern hält die Glut nicht ganz. Hild hat ${it.name} geschmiedet, ${RAR[r].n.toLowerCase()}. Es liegt in der Waffenkammer.`:`Hild hat ${it.name} geschmiedet. Es liegt in der Waffenkammer.`);if(miss)sayQ(pick(['Passiert. Der Stahl hat seinen eigenen Kopf.','Nicht jeder Kern will brennen.','Gut, aber nicht das, was ich wollte. Nächstes Mal.']),'Hild');S.fSlot=null;S.fType=null}

function group(t){const g=document.createElement('div');g.className='grp';if(t)g.innerHTML=`<div class="gt">${t}</div>`;const w=document.createElement('div');w.className='row';g.appendChild(w);$('#actions').appendChild(g);return w}
function btn(par,label,fn,o={}){const b=document.createElement('button');b.className='btn '+(o.cls||'');
b.innerHTML=`<span>${label}</span>${o.sub?`<small>${fxc(o.sub)}</small>`:''}<i class="bar"></i>`;if(o.dis)b.disabled=true;
b.onclick=()=>{if(lock||b.disabled)return;try{auInit()}catch(e){}const d=o.delay??220,br=b.querySelector('.bar');lock=true;br.style.transitionDuration=d+'ms';void b.offsetWidth;br.style.width='100%';
setTimeout(()=>{lock=false;fn();render()},d)};par.appendChild(b);return b}

else if(id==='xp')h=`<b>Erfahrung</b> – bei jedem Aufstieg wählst du eine Fähigkeit.<br>Noch ${P.xpNext-P.xp} EP bis Stufe ${P.lvl+1}.`;
else if(id==='atk')h=`<b>Angriff</b> – bestimmt deinen Schaden. Die Verteidigung des Gegners wird abgezogen.${row('Basis',P.baseAtk)}${row('Waffe',P.weapon?P.weapon.atk:0)}${row('Weitere Ausrüstung',gs('atk'))}${row('Fähigkeiten & Ereignisse',P.bonus.atk)}${row('Blutrausch',P.rageStacks)}${hasS('schatten')?`<div class="srow"><span class="bad">Schattennarbe</span><span class="r bad">−10 % Angriff</span></div>`:''}${atkPct()?`<div class="srow"><span class="good">Prozentbonus (Klingenkunst, Stärke)</span><span class="r good">+${atkPct()} %</span></div>`:''}${!P.weapon&&!P.tut?`<div class="srow"><span class="bad">Unbewaffnet</span><span class="r bad">−40 % Angriff</span></div>`:''}${P.weapon&&(CLS[P.cls].fav||[]).includes(P.weapon.type)?`<div class="srow"><span class="good">Lieblingswaffe (${WT[P.weapon.type].n})</span><span class="r good">+${favAtk()}</span></div>`:P.weapon?`<div class="srow dim"><span>Lieblingswaffe</span><span class="r">${CLS[P.cls].fav.map(t=>WT[t].n).join(', ')}</span></div>`:''}`;
else if(id==='def')h=`<b>Verteidigung</b> – wird von jedem Treffer abgezogen.${row('Basis',P.baseDef)}${row('Rüstung',P.armor?P.armor.def:0)}${row('Weitere Ausrüstung',gs('def'))}${row('Fähigkeiten & Ereignisse',P.bonus.def)}${drP()?`<div class="srow"><span class="good">Schadensminderung (max. 60 %)</span><span class="r good">−${drP()} %</span></div>`:''}${thOver()?`<div class="srow"><span class="good">+${thOver()} % über Max. → Dornen</span><span class="r good">${thOver()} %</span></div>`:''}`;
else if(id==='crit')h=`<b>Krit-Chance</b> – Krit = doppelter Schaden. Max. 75 %, Überschuss erhöht den Krit-Schaden.${row('Basis',P.baseCrit)}${row('Waffenart',P.weapon?wt(P.weapon).crit||0:0)}${row('Waffenbonus',P.weapon?P.weapon.crit||0:0)}${row('Rüstung',P.armor?at_(P.armor).crit||0:0)}${row('Weitere Ausrüstung',gs('crit'))}${row('Fähigkeiten & Ereignisse',P.bonus.crit)}${row('Kalte Hand',hasS('kalt')?10:0)}${row('Rhythmus ('+(P.rhy||0)+'×)',P.cls==='klinge'?(P.rhy||0)*(6+(P.bonus.brhy||0)):0)}${(()=>{const raw=P.baseCrit+P.bonus.crit+(P.weapon?(P.weapon.crit||0)+(wt(P.weapon).crit||0):0)+(P.armor?at_(P.armor).crit||0:0)+gs('crit')+(hasS('kalt')?10:0)+(P.cls==='klinge'?(P.rhy||0)*(6+(P.bonus.brhy||0)):0);return raw>75?`<div class="srow"><span class="good">+${raw-75} % über Max. → Krit-Schaden</span><span class="r good">×${critMul().toFixed(2).replace('.',',')}</span></div>`:''})()}`;
else if(id==='dodge')h=`<b>Ausweichen</b> – Chance, einem Treffer zu entgehen. Max. 60 %, Überschuss gibt Konter-Chance beim Ausweichen.${row('Rüstung',P.armor?(at_(P.armor).dodge||0)+(P.armor.dodge||0):0)}${row('Weitere Ausrüstung',gs('dodge'))}${row('Fähigkeiten',(P.bonus.dodge||0)+(P.bonus.rflx||0))}${row('Klingentänzer',P.cls==='klinge'?8:0)}${row('Schattennarbe',hasS('schatten')?8:0)}${dodgeRaw()>60?`<div class="srow"><span class="good">+${dodgeRaw()-60} % über Max. → Konter</span><span class="r good">${cntP()} %</span></div>`:''}`;
